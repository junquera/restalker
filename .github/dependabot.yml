version: 2
updates:
  # pyproject.toml + requirements*.txt (PEP 517/621 — uv-compatible, post-PR #63)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    # Group non-critical updates to reduce noise
    groups:
      pip-patch:
        update-types:
          - "patch"
    ignore:
      # torch: GPU/CPU variant selection is manual — automated bumps are risky
      - dependency-name: "torch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
